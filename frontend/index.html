<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAST ZONE | STALKER RP</title>
  <style>
      body { background: #000; margin: 0; overflow: hidden; }
      #initial-loader {
          position: fixed; inset: 0; background: #000;
          display: flex; align-items: center; justify-content: center;
          z-index: 9999;
      }
      .dots { display: flex; gap: 10px; height: 30px; align-items: flex-end; }
      .dot { width: 10px; height: 10px; background: #9241b8; border-radius: 50%; animation: wave 1.5s infinite ease-in-out; }
      @keyframes wave { 0%, 100% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(-20px); opacity: 1; } }
  </style>
</head>
<body>
<div id="app">
  <div id="initial-loader">
    <div class="dots">
      <div class="dot" style="animation-delay: 0s"></div>
      <div class="dot" style="animation-delay: 0.15s"></div>
      <div class="dot" style="animation-delay: 0.3s"></div>
      <div class="dot" style="animation-delay: 0.45s"></div>
      <div class="dot" style="animation-delay: 0.6s"></div>
    </div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
